name: CI

on:
  # Fork patch (docs/DECISIONS.md 2026-11-23, Actions usage): pushes skip changes that only touch
  # fork notes and records the suite never reads. Pull requests stay unfiltered.
  push:
    branches: [main]
    paths-ignore:
      - "ROADMAP.md"
      - "REVIEW.md"
      - "FORK.md"
      - "NOTICE.md"
      - "upstream-review-report.md"
      - "dependency-freshness-report.md"
      - "docs/DECISIONS.md"
      - "docs/UPSTREAM.md"
      - "tools/upstream_baseline.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: test (windows / py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Pull requests and manual runs test every supported version. Pushes to main test only
      # the bounds (3.10 and 3.14) to cut Actions usage; see docs/DECISIONS.md 2026-11-23.
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical Windows development gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1

      - name: Fork product regression tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/test_fork_regressions.ps1