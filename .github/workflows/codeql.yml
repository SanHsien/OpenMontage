name: CodeQL

on:
  # Fork patch (docs/DECISIONS.md 2026-11-23, Actions usage): pushes scan only when Python
  # source or this workflow change. Pull requests and the weekly schedule stay unfiltered.
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Python security scan
    # Python extraction needs no build, so the result does not depend on the runner OS;
    # Linux costs half the minutes of windows-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:python"